services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    # host mode: الـ bridge network بين الحاوية والهوست كان محجوب (على
    # الأغلب بسبب فايروول VPN)، فهيك الحاوية بتشارك شبكة الهوست مباشرة
    # ومافي داعي لـ host.docker.internal أو port mapping.
    network_mode: host
    environment:
      - TZ=Asia/Amman
      - GENERIC_TIMEZONE=Asia/Amman
      # بدون هاد، n8n بيفرض كوكي آمن (secure) يلي بيحتاج https، وبيكسر
      # تسجيل الدخول لما بتفتحه محلياً على http://localhost:5678
      - N8N_SECURE_COOKIE=false
      # الافتراضي 300 ثانية - عقدة Poll Until Done ممكن تقرب منه، فرفعناه
      # حتى ما يقتل الـ task runner التنفيذ قبل ما يخلص لحاله.
      - N8N_RUNNERS_TASK_TIMEOUT=600
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
